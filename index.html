<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio Website</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="d-none d-lg-block">
            <nav class="navbar bg-dark border-bottom  p-0" data-bs-theme="dark">

                <div class="nav nav-tabs bg-dark border-0" id="nav-tab" role="tablist">
                    <button class="nav-link active customizeNav" id="nav-home-tab" data-bs-toggle="tab"
                        data-bs-target="#nav-home" type="button" role="tab" aria-controls="nav-home"
                        aria-selected="true">Home</button>
                    <button class="nav-link customizeNav" id="nav-profile-tab" data-bs-toggle="tab"
                        data-bs-target="#nav-profile" type="button" role="tab" aria-controls="nav-profile"
                        aria-selected="false">About</button>
                    <button class="nav-link customizeNav" id="nav-contact-tab" data-bs-toggle="tab"
                        data-bs-target="#nav-contact" type="button" role="tab" aria-controls="nav-contact"
                        aria-selected="false">Projects</button>
                    <button class="nav-link customizeNav" id="nav-contact-tab" data-bs-toggle="tab"
                        data-bs-target="#nav-contact" type="button" role="tab" aria-controls="nav-contact"
                        aria-selected="false">Contact</button>

            </nav>
        </div>

        <div class="d-block d-lg-none">

            <nav class="col-sm navbar bg-dark">
                <div class="container-fluid customizeNav bg-dark">
                    <a class="navbar-brand customizeNav bg-dark" href="#"></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon bg-secondary"></span>
                    </button>
                    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar"
                        aria-labelledby="offcanvasNavbarLabel">
                        <div class="offcanvas-header">
                            <button type="button " class="btn-close bg-danger" data-bs-dismiss="offcanvas"
                                aria-label="Close"></button>
                        </div>
                        <div class="offcanvas-body">
                            <nav class="nav flex-column bg-transparent">
                                <a class="nav-link active customizeNav" aria-current="page" href="#">Home</a>
                                <a class="nav-link customizeNav" href="#">About</a>
                                <a class="nav-link customizeNav" href="#">Link</a>
                                <a class="nav-link customizeNav" href="#">Contact</a>
                            </nav>
                        </div>
                    </div>
                </div>
            </nav>


        </div>



    </header>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
